<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sector 04 - Soberanía y Corporaciones</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { background-color: #070a0e; color: #79c0ff; font-family: 'Courier New', Courier, monospace; padding: 16px; margin: 0; }
    .panel { border: 1px solid #1f6feb; padding: 16px; max-width: 760px; margin: 0 auto; background: #0d1117; box-shadow: 0 0 12px rgba(31, 111, 235, 0.25); }
    .header-bar { display: flex; justify-content: space-between; border-bottom: 1px dashed #30363d; padding-bottom: 8px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .box { background: #090d12; border: 1px solid #21262d; padding: 10px; }
    .bar-track { width: 100%; height: 8px; background: #161b22; border: 1px solid #30363d; margin: 2px 0 6px 0; }
    .bar-fill { height: 100%; transition: width 0.3s; }
    .shield-fill { background: #388bfd; }
    .armor-fill { background: #d29922; }
    .cap-fill { background: #e3b341; }
    .btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: 0.85em; margin: 2px; }
    .btn:hover { background: #30363d; border-color: #8b949e; }
    .btn-warp { border-color: #a371f7; color: #d2a8ff; font-weight: bold; }
    .btn-act { border-color: #238636; color: #3fb950; font-weight: bold; }
    .btn-sos { border-color: #da3633; color: #f85149; font-weight: bold; }
    .btn-loot { border-color: #e3b341; color: #e3b341; font-weight: bold; }
    .btn-sov { border-color: #f0883e; color: #f0883e; font-weight: bold; }

    #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 10, 14, 0.95); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .login-box { background: #0d1117; border: 1px solid #1f6feb; padding: 24px; max-width: 380px; width: 100%; text-align: center; }
    .login-input { background: #010409; border: 1px solid #30363d; color: #79c0ff; font-family: inherit; padding: 8px; width: 85%; margin: 12px 0; }

    .chat-section { margin-top: 12px; background: #010409; border: 1px solid #21262d; padding: 8px; }
    .chat-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
    .chat-tab { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 4px 8px; font-size: 0.75em; cursor: pointer; }
    .chat-tab.active { background: #1f6feb; color: #fff; border-color: #58a6ff; }
    #chat-box { height: 120px; overflow-y: auto; font-size: 0.8em; line-height: 1.4; color: #c9d1d9; }
    .chat-form { display: flex; gap: 4px; margin-top: 6px; }
    .chat-input { flex-grow: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 6px; font-family: inherit; font-size: 0.8em; }
    .sos-banner { background: #3b0d0c; border: 1px solid #da3633; padding: 6px 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.82em; }
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <h3 style="color: #58a6ff; margin-top: 0;">TERMINAL PILOTO // EVE TEXT</h3>
    <p style="font-size: 0.85em; color: #8b949e;">Introduce tu nombre de comandante:</p>
    <input type="text" id="login-name" class="login-input" placeholder="Cmdr_Vance" maxlength="14" autofocus>
    <br>
    <button class="btn btn-act" style="width: 90%; padding: 8px;" onclick="doLogin()">Entrar al Universo</button>
  </div>
</div>

<div class="panel">
  <div id="sos-zone" style="display: none;"></div>

  <div class="header-bar">
    <div><strong>SECTOR: <span id="sector-title" style="color: #e3b341;">...</span></strong></div>
    <div>BILLETERA: <b id="my-wallet" style="color: #7ee787;">0</b> ISK</div>
  </div>

  <div class="grid">
    <!-- Tu Nave -->
    <div class="box">
      <div style="color: #58a6ff; font-weight: bold;" id="my-name">[PILOTO ACTIVO]</div>
      <div style="font-size: 0.8em; color: #d2a8ff;">Corp: <b id="my-corp">Sin Corp</b></div>
      <div style="font-size: 0.75em; margin-top:4px;">ESCUDO: <span id="my-shield">100</span>%</div>
      <div class="bar-track"><div id="bar-shield" class="bar-fill shield-fill"></div></div>
      <div style="font-size: 0.75em;">BLINDAJE: <span id="my-armor">100</span>%</div>
      <div class="bar-track"><div id="bar-armor" class="bar-fill armor-fill"></div></div>
      <div style="font-size: 0.75em;">CAPACITOR: <span id="my-cap">100</span> Gj</div>
      <div class="bar-track"><div id="bar-cap" class="bar-fill cap-fill"></div></div>
      <div style="font-size: 0.8em; margin-top: 6px;">Bodega: <b id="my-ore" style="color: #56d364;">0</b> m³ mineral</div>
    </div>

    <!-- Navegación -->
    <div class="box">
      <div style="color: #d2a8ff; font-weight: bold; margin-bottom: 6px;">COMPUTADORA DE SALTO:</div>
      <button class="btn btn-warp" onclick="warpTo('station')">Saltar a Estación Central</button><br>
      <button class="btn btn-warp" onclick="warpTo('mining')">Saltar a Cinturón Minero</button><br>
      <button class="btn btn-warp" onclick="warpTo('nullsec')">Saltar a Nullsec (PvP / Soberanía)</button>
    </div>
  </div>

  <div class="box" id="sector-actions"></div>
  <div id="wrecks-container" style="display: none; margin-top: 8px;"></div>

  <!-- Chat en vivo -->
  <div class="chat-section">
    <div class="chat-tabs">
      <button class="chat-tab active" id="tab-galaxy" onclick="switchChat('galaxy')">CANAL GALAXIA</button>
      <button class="chat-tab" id="tab-local" onclick="switchChat('local')">CANAL LOCAL</button>
    </div>
    <div id="chat-box">--- Conectado a la subred de comunicaciones ---</div>
    <form class="chat-form" onsubmit="sendChat(event)">
      <input type="text" id="chat-input" class="chat-input" placeholder="Transmitir mensaje..." autocomplete="off">
      <button type="submit" class="btn btn-act">Enviar</button>
    </form>
  </div>
</div>

<script>
  const socket = io();
  let myPilot = null;
  let activeChannel = 'galaxy';

  function doLogin() {
    const val = document.getElementById('login-name').value;
    if (!val.trim()) return;
    socket.emit('pilot_login', val);
  }

  socket.on('login_success', (pilot) => {
    myPilot = pilot;
    document.getElementById('login-overlay').style.display = 'none';
  });

  function switchChat(ch) {
    activeChannel = ch;
    document.getElementById('tab-galaxy').className = `chat-tab ${ch === 'galaxy' ? 'active' : ''}`;
    document.getElementById('tab-local').className = `chat-tab ${ch === 'local' ? 'active' : ''}`;
  }

  function appendChat(msgHtml) {
    const box = document.getElementById('chat-box');
    box.innerHTML += `<div>${msgHtml}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  function sendChat(e) {
    e.preventDefault();
    const inp = document.getElementById('chat-input');
    if (!inp.value.trim()) return;
    socket.emit('send_chat', { channel: activeChannel, text: inp.value });
    inp.value = '';
  }

  function warpTo(sec) { socket.emit('warp_to', sec); }
  function emitSOS() { socket.emit('send_sos'); }
  function lootWreck(id) { socket.emit('loot_wreck', id); }

  function setCorporation() {
    const tag = prompt("Introduce el tag de tu Corporación/Alianza (máx 5 letras, ej: TITAN):");
    if (tag) socket.emit('set_corp', tag);
  }

  socket.on('chat_broadcast', (data) => {
    const color = data.channel === 'galaxy' ? '#79c0ff' : '#56d364';
    appendChat(`<span style="color:${color};">[${data.channel.toUpperCase()}] <b>${data.sender}:</b></span> ${data.text}`);
  });

  socket.on('sos_alert', (data) => {
    const banner = document.getElementById('sos-zone');
    banner.style.display = 'flex';
    banner.className = 'sos-banner';
    banner.innerHTML = `
      <span><b style="color:#f85149;">¡ALERTA DE FLOTA S.O.S.!</b> ${data.pilot} bajo fuego en ${data.sectorName}.</span>
      <button class="btn btn-sos" onclick="warpTo('${data.sectorId}')">SALTAR A RESCATAR</button>
    `;
    setTimeout(() => { banner.style.display = 'none'; }, 15000);
  });

  socket.on('universe_tick', (data) => {
    if (!myPilot) return;
    const me = data.players[socket.id];
    if (!me) return;

    const secInfo = data.sectors[me.sector];

    document.getElementById('sector-title').innerText = secInfo.name;
    document.getElementById('my-name').innerText = `[TU NAVE] ${me.name}`;
    document.getElementById('my-corp').innerText = `[${me.corp}]`;
    document.getElementById('my-wallet').innerText = me.wallet;
    document.getElementById('my-shield').innerText = me.shield;
    document.getElementById('my-armor').innerText = me.armor;
    document.getElementById('my-cap').innerText = me.cap;
    document.getElementById('my-ore').innerText = me.ore;

    document.getElementById('bar-shield').style.width = me.shield + '%';
    document.getElementById('bar-armor').style.width = me.armor + '%';
    document.getElementById('bar-cap').style.width = me.cap + '%';

    const actionsBox = document.getElementById('sector-actions');
    const wrecksBox = document.getElementById('wrecks-container');

    if (me.sector === 'station') {
      wrecksBox.style.display = 'none';
      actionsBox.innerHTML = `
        <b style="color:#58a6ff;">OFICINAS DE CORPORACIÓN Y HANGAR:</b><br>
        <button class="btn" onclick="setCorporation()">Fundar o Cambiar Corporación</button>
        <button class="btn btn-act" onclick="socket.emit('sell_ore')">Vender Mineral (+20 ISK c/u)</button>
        <button class="btn" onclick="socket.emit('repair')">Reparar Casco (50 ISK)</button>
      `;
    } else if (me.sector === 'mining') {
      wrecksBox.style.display = 'none';
      actionsBox.innerHTML = `
        <b style="color:#56d364;">CINTURÓN VELDSPAR-4:</b> (Roca: ${secInfo.asteroidHp}%)<br>
        <button class="btn btn-act" onclick="socket.emit('mine_cycle')">Activar Láser de Extracción (+5 menas)</button>
      `;
    } else if (me.sector === 'nullsec') {
      const sov = secInfo.sovereignty;
      actionsBox.innerHTML = `
        <div style="border-bottom: 1px dashed #30363d; padding-bottom: 6px; margin-bottom: 6px;">
          SOBERANÍA DEL SISTEMA: <b style="color:#f0883e;">[${sov.ownerCorp}]</b> (${sov.progress}%)
          <button class="btn btn-sov" style="margin-left: 8px;" onclick="socket.emit('capture_sov')">Capturar Baliza Soberana</button>
        </div>
        <b style="color:#ff7b72;">SISTEMA NULLSEC // RELOJ: ${secInfo.timer}s (Ronda ${secInfo.round})</b><br>
        <button class="btn btn-act" onclick="socket.emit('set_order', 'attack')">Disparar Baterías (-25 Gj)</button>
        <button class="btn" onclick="socket.emit('set_order', 'defense')">Reforzar Escudo (-20 Gj)</button>
        <button class="btn btn-sos" onclick="emitSOS()">Emitir S.O.S. Galáctico</button>
        <span style="font-size:0.8em; margin-left:8px; color:#f0883e;">Orden: ${me.order.toUpperCase()}</span>
      `;

      if (secInfo.wrecks && secInfo.wrecks.length > 0) {
        wrecksBox.style.display = 'block';
        wrecksBox.innerHTML = `<b style="color:#e3b341;">RESTOS DE NAVES FLOTANDO:</b>` +
          secInfo.wrecks.map(w => `
            <div style="background:#161b22; border:1px dashed #e3b341; padding:4px 8px; margin-top:4px; display:flex; justify-content:space-between; align-items:center;">
              <span>${w.name} (${w.ore} m³ menas, +${w.credits} ISK)</span>
              <button class="btn btn-loot" onclick="lootWreck(${w.id})">Saquear Pecio</button>
            </div>
          `).join('');
      } else {
        wrecksBox.style.display = 'none';
      }
    }
  });

  socket.on('ship_destroyed', (msg) => alert(msg));
  socket.on('combat_log', (logs) => {
    appendChat(`<span style="color:#f0883e;"><b>[RESOLUCIÓN DE COMBATE NULLSEC]:</b></span>`);
    logs.forEach(l => appendChat(`> ${l}`));
  });
</script>

</body>
</html>
